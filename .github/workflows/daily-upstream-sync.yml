name: Daily upstream sync

on:
  schedule:
    # Runs every day at 15:30 UTC (morning Pacific; exact wall-clock time shifts with DST).
    - cron: "30 15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream/main into custom/main
    runs-on: ubuntu-latest

    steps:
      - name: Check out custom/main
        uses: actions/checkout@v4
        with:
          ref: custom/main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream/main
        run: |
          git remote add upstream https://github.com/NousResearch/hermes-agent.git
          git fetch upstream main
          git merge --no-edit upstream/main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest pytest-asyncio pytest-xdist pyyaml

      - name: Run sync smoke tests
        run: |
          python -m pytest \
            tests/gateway/test_discord_free_response.py \
            tests/gateway/test_config.py \
            tests/hermes_cli/test_config.py \
            -q -o 'addopts='
          python -m py_compile gateway/platforms/discord.py gateway/config.py hermes_cli/config.py

      - name: Push updated custom/main
        run: git push origin HEAD:custom/main

      - name: Close prior sync failure issue
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily upstream sync failed";
            const {owner, repo} = context.repo;
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "upstream-sync",
              per_page: 20,
            });
            for (const issue of issues.data.filter(i => i.title === title && !i.pull_request)) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: `Resolved by successful sync run: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              });
              await github.rest.issues.update({owner, repo, issue_number: issue.number, state: "closed"});
            }

      - name: Open or update sync failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Daily upstream sync failed";
            const {owner, repo} = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const body = [
              "The daily upstream sync from `NousResearch/hermes-agent:main` into `custom/main` failed.",
              "",
              `Run: ${runUrl}`,
              "",
              "Check the workflow logs for merge conflicts or test failures. No changes were pushed from this failed run.",
            ].join("\n");
            const issues = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              labels: "upstream-sync",
              per_page: 20,
            });
            const existing = issues.data.find(i => i.title === title && !i.pull_request);
            if (existing) {
              await github.rest.issues.createComment({owner, repo, issue_number: existing.number, body});
            } else {
              await github.rest.issues.create({owner, repo, title, body, labels: ["upstream-sync"]});
            }
